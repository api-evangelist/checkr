                accidents:
                  type: array
                  description: Array of Accident objects.
                  items:
                    type: object
                    properties:
                      accident_date:
                        type: string
                        example: '2009-04-12'
                      description:
                        type: string
                        example: property damage
                      city:
                        type:
                        - string
                        - 'null'
                        example: null
                      county:
                        type: string
