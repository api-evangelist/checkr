- aid: checkr:checkr-report-eta-api
  name: Checkr Report ETA API
  description: >-
    Report ETAs predict when screenings will complete for each background check report. This ETA provides
    a date for the estimated completion of a specific report, helping both you and your candidates plan
    ahead.


    While the predictions are highly accurate, they are not a guarantee. Some county-level searches are
    subject to unpredictable timelines, due to manual search processes and court availability. For more
    information on these searches, please see [County Criminal Record Search](https://help.checkr.com/hc/en-us/articles/360001686627)
    in the Checkr Help Center.


    90% of reports will complete within one business day of the estimated date.


    For those reports which do not complete within the initial estimate, Checkr will re-generate the ETA
    using the current information available for the remaining screenings. A [report.updated](#section/Webhooks/Report-events)
    webhook will be issued for both the initial and each subsequent ETA.


    For more information, see [Checkr ETA](https://help.checkr.com/hc/en-us/articles/360025682094) in
    the Checkr Help Center.
  humanURL: https://docs.checkr.com/
  baseURL: https://api.checkr.com/v1
