- aid: checkr:checkr-employers-api
  name: Checkr Employers API
  description: >-
    The Employers resource includes all relevant employer information for the specified Candidate.

    Employer resources are tied to the specified candidate, and do not transfer to other employees within
    the system.

    Once attached to a candidate, all employers are retained when running subsequent employment verifications.
    For example, if multiple employment verifications are run for an existing candidate, each report will
    use all employers attached to that candidate for the verification.
  humanURL: https://docs.checkr.com/
  baseURL: https://api.checkr.com/v1
  tags:
