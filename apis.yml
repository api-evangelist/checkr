- aid: checkr:checkr-ssn-trace-api
  name: Checkr SSN Trace API
  description: >-
    SSN Trace is typically the first screening run, and is used to verify that

    the input SSN exists, determine where and when it was issued, and to compile

    a list of all known aliases associated with the SSN. This Trace is also used to generate

    a list of all known addresses recorded by credit agencies for the SSN for the last 7 years.


    An SSN Trace may be used to determine which additional jurisdictions should be searched for

    the candidate, based on the list of known addresses returned.


    If the platform detects an issue with the SSN Trace run (data mismatch, absence of data,

    or inclusion of the SSN on the death master file), Checkr may issue an exception and ask

    the candidate to either re-enter their SSN or upload other supporting documentation.


    <b>Note: </b>Information returned by this search is not a part of the consumer report and may not
    be used for FCRA purposes, including eligibility determinations under the FCRA


    For more information, please see

    [SSN Trace](https://help.checkr.com/hc/en-us/articles/360001967227)

