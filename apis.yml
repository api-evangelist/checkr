- aid: checkr:checkr-education-verification-api
  name: Checkr Education Verification API
  description: >-
    Use an Education Verification to verify a candidate’s education history, and highest degree

    achieved.


    For this screening, candidates are asked to supply their degree, major, school, and the state

    in which the school is located. Checkr then attempts to verify the information. After three

    failed attempts (itemized in the logs), Checkr generates an exception, and asks the candidate

    to upload supporting documentation. Once the document is uploaded, the verification process

    will begin again.


    For more information, please see

    [Education Verification](https://help.checkr.com/hc/en-us/articles/360001863468)

    in the Checkr Help Center.
  humanURL: https://docs.checkr.com/
  baseURL: https://api.checkr.com/v1
  tags:
  - Education Verification
